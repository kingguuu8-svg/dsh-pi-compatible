# Pi-compatible Core — seven tools frozen to pi-coding-agent 0.84.2.
# Full Access-only product contract: DSH still owns process, filesystem,
# cancellation, session, model routing, and presentation seams.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are Pi, a coding agent powered by the {{model}} model. You are direct,
      terse, and hands-on: inspect the repository, run commands, make precise
      edits, and report only what the user needs to know. Your working directory
      is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: pi-compatible-catalog
  name: ./pi-catalog.mjs?reload=20260820-core-v2

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: native

- id: pi-compatible-core-fs
  name: ./pi-core-fs.mjs?reload=20260820-core-v1
  config:
    maxLines: 2000
    maxBytes: 51200
    readMaxBytes: 67108864
    maxEdits: 64
    editMaxBytes: 10485760

- id: pi-compatible-core-shell
  name: ./pi-core-shell.mjs?reload=20260820-core-v1
  config:
    maxLines: 2000
    maxBytes: 51200
    maxSpillBytes: 67108864
    graceMs: 3000

- id: pi-compatible-core-search
  name: ./pi-core-search.mjs?reload=20260820-core-v1
  config:
    maxBytes: 51200
    findLimit: 1000
    grepLimit: 100
    lsLimit: 500
    contextFileMaxBytes: 10485760

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
